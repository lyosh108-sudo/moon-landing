  <style>
   
:root {
  color-scheme: dark;
  --ink: #efbb69;
  --dim: #b5925b;
  --line: #806039;
}

* {
  box-sizing: border-box;
}

body {
  background: #090a09;
  color: var(--ink);
  font: 16px/1.6 Consolas,"Liberation Mono",monospace;

main {

}

header,section,footer {

header {

}

h1 {

.hint {

.langs {

}

.row {

  justify-content: space-between;

  padding: 7px 0;
}

.value {
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

button,input {
  font: inherit;
  color: inherit;
  background: transparent;
}

button {
  border: 0;
  padding: 8px 4px;
  cursor: pointer;
}

button:before {
  content: "[ ";
}

button:after {
  content: " ]";
}

button:hover,button[aria-pressed=true] {
  background: #2b261b;
  color: #ffe6b7;
}

button:focus-visible,input:focus-visible {

}

label {

}

.entry {

input {

  border-bottom: 1px solid var(--ink);

.entry button {

}

.error {

.warn {

}

.danger {

footer {

details {

}

summary {

details p {

}

.result {

  padding: 14px;
  margin-top: 16px;
}

.result p {
  margin: 8px 0;
}

.crater {
  border-top: 1px dashed var(--line);
  padding-top: 10px;
}

.scroll {
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
  font-size: 12px;
}

td,th {
  text-align: right;
  padding: 6px;
  border-bottom: 1px solid #403725;
}

[hidden] {
  display: none !important;
}

@media (max-width:520px) {
  body {
    font-size: 14px;
    padding: 10px 6px;
  }

  header,section,footer {
    padding: 16px;
  }

  h1 {
    font-size: 19px;
  }

  .entry {
    flex-wrap: wrap;
  }

  .entry input {
    flex: 1;
  }

  .entry button {
    width: 100%;
  }

  details {
    padding: 12px 16px;
  }

}

:root {
  --ink: #AEFF86;
  --dim: #AEFF86;
  --line: #527b40;
}

main {
  max-width: 850px;
  background: #080c08;
}

button:hover,button[aria-pressed=true] {

td,th {

}

.warn,.danger {

  flex-wrap: wrap;
  margin-bottom: 18px;

.screen-wrap {
  width: 100%;
  overflow: hidden;

.screen {
  font: 12px/1.1 Consolas,"Liberation Mono",monospace;

  color: #AEFF86;

.screen pre {

  padding: 0;

  overflow: visible;

.digits {

.arrow-up {

@media (max-width: 600px) {
  .screen.mobile-screen {
    width: 100%;
    padding: 4px 12px;
    border: 1px solid var(--line);

  .mobile-instrument {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);

  .mobile-instrument + .mobile-instrument {

  .mobile-label {
    font-size: 15px;

    white-space: nowrap;
  }

  .mobile-unit {

  .direction-slot {
    display: inline-block;

  }

  .screen.mobile-screen pre {

    line-height: 1.1;
    font-weight: bold;
    white-space: pre;
  }

@media (max-width: 360px) {
  .screen.mobile-screen {
    padding: 4px 8px;
  }

  .mobile-instrument {
    column-gap: 6px;
  }

  .mobile-label {
    font-size: 13px;
  }

  .mobile-unit {
    font-size: 11px;
  }

}

  <script>
   

// Physical constants
const G0=9.80665,
FT=1/0.3048;

// Simulation engine
class Game {
  constructor() {
    this.h=1000;
    this.v=150;
    this.fuel10=5000;
    this.m=500;
    this.t=0;
    this.g=0;
    this.done=false;
    this.grade=null;
    this.rows=[];
  }
  step(s) {
    if(this.done||!Number.isFinite(s)||s<0)throw Error('Invalid input');
    const b=s<=this.m?s:0;
    this.t++;
    this.fuel10-=Math.round(b*10);
    this.m=this.fuel10/10;
    const a=b/(2+this.m/1000);
    this.g=a/G0;
    this.v+=1.62-a;
    this.h-=this.v;
    if(this.h<=0) {
      this.done=true;
      this.grade=Math.min(9, Math.floor(-this.h+Math.abs(this.v)+1));
    }
    this.rows.push( {
      t:this.t, s, b, h:this.h, v:this.v, m:this.m, g:this.g
    }
    );
  }
}
function mark(g) {
  return g>9?' (Х!!!Х)':g>=6?' (!!!)':g>=3?' (!)':'';
}

// Internal reference verification
function test() {
  let g=new Game();
  let n=0;
  const e= {
    1:856.4,
    2:719.4,
    3:591,
    5:366.9,
    7:194.1,
    8:130.5,
    9:85.6,
    10:57.4,
    11:46.2,
    12:38.1,
    13:33.2,
    14:26.6,
    15:18.4,
    16:10.9,
    17:5.1,
    18:1.6,
    19:1.2,
    20:1.5,
    21:.3
  }
  ;
  for(const s of[20, 20, 25, 30, 30, 35, 35, 40, 45, 40, 40, 10, 10, 0, 0, 5, 7, 8, 10, 5, 0, 3]) {
    g.step(s);
    if(e[g.t]!==undefined&&Math.abs(e[g.t]-g.h)<=.05)n++;
  }
  return n===19&&g.grade===3&&g.t===22&&g.m===82;
}

// Translations
const strings= {
  ru: {

    testbutton:'ПРОГНАТЬ ТЕСТ',
    invalid:'Введите неотрицательное число с точностью не более одной цифры после точки или запятой.',
    shortage:'Расход не может превышать остаток топлива.',

    finished:'ПОСАДКА ЗАВЕРШЕНА',
    grade:'Оценка',
    crater:'Глубина кратера',
    reserve:'Топливный резерв обратного старта сохранён.',
    noreserve:'Топлива для обратного старта недостаточно.',
    headers:['Ход',
    'Ввод, т',
    'Сожжено, т',
    'Высота, м',
    'Скорость, м/с',
    'Топливо, т',
    'G'],
    grades:['',
    'Идеальная посадка',
    'Нормальная посадка',
    'Тяжёлая посадка',
    'Посадка с легко устранимыми повреждениями',
    'Неустранимые повреждения; обратный старт вряд ли возможен',
    'Очень сильные повреждения',
    'Разгерметизация отдельных блоков; жизнь экипажа под угрозой',
    'Гибель экипажа',
    'Взрыв корабля'],
    manual:['Один ход — 1 сек модельного времени. Пока вы размышляете, время не идёт. Цель — мягкая посадка с экономией топлива и времени.',
    'Начальные условия: 1000 м; снижение 150 м/с; топливо 500 т. Лунное ускорение — 1,62 м/с². Резерв обратного старта — 95 т.',
    'Расход: от 0 до остатка топлива, с шагом 0,1 т. При нулевом запасе все ходы рассчитываются, но показываются не более четырёх этапов.',

    'Оценки выше 9 ограничены девяткой. Глубина кратера — игровое название расстояния ниже поверхности на завершающем шаге. Удар и торможение в грунте не моделируются.',
    'Сообщение о топливе после посадки показывается только для оценок 1–3: они не сообщают о повреждениях или ранениях.',
    'Исправлена команда 37: ИПВ → ИП8. Известные расхождения книги: скорость на 7-м ходу 79,631 вместо 76,6 м/с; завершение на 22 вместо 21 сек.',
    'Смена языка не меняет полёт. Английский режим показывает расстояния в футах и скорости в ft/sec; топливо остаётся в метрических тоннах.']
  }
  ,
  en: {
    title:'MOON LANDING',
    subtitle:'Based on “Five Evenings with a Microcalculator”, 1988 / v8',
    height:'Altitude',
    down:'Descent speed',
    up:'Ascent speed',
    fuel:'Fuel',
    time:'Flight time',
    g:'Crew G-load',
    distance:'ft',
    speed:'ft/sec',
    mass:'t',
    sec:'sec',
    label:'Fuel for the next second, metric tonnes',
    placeholder:'Enter a number',
    step:'EXECUTE STEP',
    help:'Enter: next step. Fuel increment 0.1 t. Dot or comma.',
    instructions:'INSTRUCTIONS',
    restart:'NEW GAME',
    manualtitle:'Pilot briefing',
    logtitle:'Flight log',
    lotesttitle:'Book example verification',
    testbutton:'RUN TEST',
    invalid:'Enter a finite nonnegative number. Empty input does not advance the flight.',
    shortage:'Fuel input cannot exceed the remaining fuel.',
    zero:'Fuel burn set to zero: insufficient fuel.',
    reset:'Start a new flight? Current progress will be lost.',
    finished:'LANDING COMPLETE',
    grade:'Rating',
    crater:'Crater depth',
    reserve:'The return-launch fuel reserve is preserved.',
    noreserve:'Insufficient fuel for a return launch.',
    headers:['Step',
    'Input, t',
    'Burned, t',
    'Altitude, ft',
    'Velocity, ft/sec',
    'Fuel, t',
    'G'],
    grades:['',
    'Perfect landing',
    'Normal landing',
    'Hard landing',
    'Landing with easily repairable damage',
    'Irreparable damage; a return launch is unlikely',
    'Very severe damage',
    'Partial depressurization; crew lives at risk',
    'Crew lost',
    'Spacecraft explosion'],
    manual:['Each step advances the simulation by 1 sec. Time stands still while you think. Aim for a gentle landing while saving fuel and time.',
    'Initial conditions: altitude 3280.84 ft; descent speed 492.13 ft/sec; fuel 500 metric tonnes. Lunar gravity: 5.315 ft/sec². Return-launch reserve: 95 tonnes.',
    'Fuel input uses 0.1 t increments and cannot exceed the remaining fuel. Engine-off flight shows at most four stages; the log records every step.',
    'G-load markers: 3 to below 6 G: (!); 6 through 9 G: (!!!); above 9 G: (Х!!!Х). These are game warnings, not medical limits. They do not affect the outcome.',
    'Ratings above 9 are capped at 9. Crater depth is the game name for the below-surface distance on the last step. Impact and soil braking are not simulated.',
    'The post-landing fuel message appears only for ratings 1–3, which do not report damage or injuries.',
    'Instruction 37 corrected: recall B → recall 8. Known discrepancies in the book: step-7 speed is 261.257 rather than the printed 251.312 ft/sec; landing takes 22 rather than 21 sec.',
    'Switching languages does not alter the flight. Distance is shown in feet and speed in ft/sec. Fuel always uses metric tonnes (t), not US or imperial tons.']
  }
}
let lang='ru',
game=new Game(),
errorKey='',
busy=false,
epoch=0,
phase='result';
const $=id=>document.getElementById(id);
const f=(n, d=1)=>n.toLocaleString(lang==='ru'?'ru-RU':'en-US',  {
  minimumFractionDigits:d, maximumFractionDigits:d
}
);
function p(parent, text, cls='') {
  const e=document.createElement('p');
  e.textContent=text;
  e.className=cls;
  parent.append(e);
}

// Desktop and compact mobile instruments
function render() {
  const s=strings[lang],
  k=lang==='en'?FT:1;
  document.documentElement.lang=lang;
  document.title=s.title;
  $('rus').setAttribute('aria-pressed', String(lang==='ru'));
  $('eng').setAttribute('aria-pressed', String(lang==='en'));
  for(const id of['title', 'subtitle', 'label', 'step', 'help', 'instructions', 'restart', 'manualtitle', 'logtitle', 'loghint'])$(id).textContent=s[id];
  $('burn').placeholder=s.placeholder;
  $('error').textContent=errorKey?s[errorKey]:'';
  const ins=$('instruments');
  ins.replaceChildren();
  const meta=document.createElement('div');
  meta.className='meta';
  for(const text of[s.g+': '+f(game.g)+' G'+mark(game.g), s.time+': '+game.t+' '+s.sec]) {
    const el=document.createElement('span');
    el.textContent=text;
    meta.append(el);
  }
  ins.append(meta);
  const wrap=document.createElement('div');
  wrap.className='screen-wrap';
  const screen=document.createElement('div');
  screen.className='screen'+(phase==='off'?' off':'');
  function line(text) {
    const el=document.createElement('pre');
    el.textContent=text;
    screen.append(el);
    return el;
  }
  const mobile=window.matchMedia('(max-width: 600px)').matches;
  if(mobile) {
    screen.classList.add('mobile-screen');
    const names=[s.height,
    lang==='ru'?'Скорость':'Speed',
    s.fuel];
    const units=[s.distance,
    s.speed,
    s.mass];
    const values=[game.h*k,
    game.v*k,
    game.m];
    const widths=[30,
    26,
    18];
    for(let i=0; i<3; i++) {
      const instrument=document.createElement('div');
      instrument.className='mobile-instrument';
      const label=document.createElement('div');
      label.className='mobile-label';
      const arrow=document.createElement('span');
      arrow.className='direction-slot';
      arrow.textContent=i===1?(game.v<0?'↑':game.v>0?'↓':' '):' ';
      if(i===1&&game.v<0)arrow.className+=' arrow-up';
      label.append(arrow, document.createTextNode(names[i].toUpperCase()));
      const unit=document.createElement('span');
      unit.className='mobile-unit';
      unit.textContent=' ('+units[i]+')';
      label.append(unit);
      const digits=document.createElement('pre');
      digits.className='digits';
      const field=segmentField(values[i], widths[i], phase==='all', i);
      const leading=Math.min(...field.map(row=>row.search(/\S/)));
      digits.textContent=field.map(row=>row.slice(Math.max(0, leading))).join('\n');
      digits.setAttribute('aria-label', names[i]+': '+f(values[i])+' '+units[i]);
      instrument.append(label, digits);
      screen.append(instrument);
    }
  }
  else {
    line('┌'+'─'.repeat(86)+'┐');
    const widths=[30,
    26,
    18],
    labels=[s.height+' · '+s.distance,
    (game.v<0?'↑':game.v>0?'↓':' ')+' '+(lang==='ru'?'Скорость':'Speed')+' · '+s.speed,
    s.fuel+' · '+s.mass];
    const title=line('');
    title.append(document.createTextNode('│  '+labels[0].padEnd(30)+'    '));
    const arrow=document.createElement('span');
    arrow.textContent=labels[1][0];
    if(game.v<0)arrow.className='arrow-up';
    title.append(arrow, document.createTextNode(labels[1].slice(1).padEnd(25)+'    '+labels[2].padEnd(18)+'  │'));
    const fields=[game.h*k,
    game.v*k,
    game.m].map((v, i)=>segmentField(v, widths[i], phase==='all', i));
    for(let r=0; r<3; r++) {
      const el=line('│  ');
      const digits=document.createElement('span');
      digits.className='digits';
      digits.textContent=fields.map(x=>x[r]).join('    ');
      el.append(digits, document.createTextNode('  │'));
    }
    line('└'+'─'.repeat(86)+'┘');
  }
  wrap.append(screen);
  ins.append(wrap);
  const status=document.createElement('div');
  status.className='statusline';
  status.textContent=busy?(lang==='ru'?'РАСЧЁТ…':'COMPUTING…'):'';
  ins.append(status);
  $('step').disabled=busy;
  $('burn').disabled=busy;
  requestAnimationFrame(()=> {
    if(mobile||!screen.isConnected)return; const scale=Math.min(1, wrap.clientWidth/screen.offsetWidth); screen.style.transform='scale('+scale+')'; wrap.style.height=screen.offsetHeight*scale+'px';
  }
  );
  $('inputpanel').hidden=game.done||game.m===0;
  $('result').hidden=!game.done;
  if(game.done) {
    const el=$('result');
    el.replaceChildren();
    p(el, s.finished+' - ('+game.grade+') '+s.grades[game.grade].toUpperCase());
    p(el, s.crater+': '+f(Math.max(0, -game.h)*k, 1)+' '+s.distance, 'crater');
    if(game.grade<=3)p(el, game.m>=95?s.reserve:s.noreserve);
  }
  $('manualtext').replaceChildren();
  for(const text of s.manual)p($('manualtext'), text);
  $('loghead').replaceChildren();
  const hr=document.createElement('tr');
  for(const text of s.headers) {
    const th=document.createElement('th');
    th.textContent=text;
    hr.append(th);
  }
  $('loghead').append(hr);
  $('log').replaceChildren();
  for(const r of game.rows) {
    const tr=document.createElement('tr');
    for(const text of[r.t, f(r.s, 1), f(r.b, 1), f(r.h*k, 1), f(r.v*k, 1), f(r.m, 1), f(r.g, 1)+mark(r.g)]) {
      const td=document.createElement('td');
      td.textContent=text;
      tr.append(td);
    }
    $('log').append(tr);
  }
}

// Text-only segmented digits
const glyph= {
  '0':[' _ ',
  '| |',
  '|_|'],
  '1':['   ',
  '  |',
  '  |'],
  '2':[' _ ',
  ' _|',
  '|_ '],
  '3':[' _ ',
  ' _|',
  ' _|'],
  '4':['   ',
  '|_|',
  '  |'],
  '5':[' _ ',
  '|_ ',
  ' _|'],
  '6':[' _ ',
  '|_ ',
  '|_|'],
  '7':[' _ ',
  '  |',
  '  |'],
  '8':[' _ ',
  '|_|',
  '|_|'],
  '9':[' _ ',
  '|_|',
  ' _|'],
  '.':[' ',
  ' ',
  '.'],
  '-':['   ',
  ' _ ',
  '   ']
}
;
function segmentField(value, width, all, index) {
  let raw=Number(value.toFixed(1)).toString();
  if(value<0&&!raw.startsWith('-'))raw='-'+raw;
  if(all)raw=index===0?'-88888.8':index===1?'-8888.8':'888.8';
  const lines=[0,
  1,
  2].map(r=>[...raw].map(c=>glyph[c][r]).join(' '));
  return lines.map(x=>x.length>width?'ERR'.padStart(width):x.padStart(width));
}

// Compressed automatic flight
function coastTargets(n) {
  if(n<=4)return Array.from( {
    length:n
  }
  , (_, i)=>i+1);
  const q=Math.floor(n/4);
  return[q,
  q*2,
  q*3,
  n];
}
function coastCount(source) {
  const copy=new Game();
  Object.assign(copy, source);
  copy.rows=[];
  let n=0;
  while(!copy.done) {
    copy.step(0);
    n++;
    if(n>100000)throw Error('Flight safety limit');
  }
  return n;
}

// Three animation phases, 333 ms each
const delay=ms=>new Promise(resolve=>setTimeout(resolve, ms));
async function animateTo(target, id) {
  phase='off';
  render();
  await delay(333);
  if(id!==epoch)return false;
  phase='all';
  render();
  await delay(333);
  if(id!==epoch)return false;
  phase='off';
  render();
  await delay(333);
  if(id!==epoch)return false;
  game=target;
  phase='result';
  render();
  return true;
}
function copyGame(source) {
  const copy=new Game();
  Object.assign(copy, source);
  copy.rows=source.rows.slice();
  return copy;
}
async function runTurn(n) {
  if(busy||game.done)return;
  busy=true;
  const id=epoch;
  errorKey='';
  const next=copyGame(game);
  next.step(n);
  if(!await animateTo(next, id))return;
  if(!game.done&&game.m===0) {
    const targets=coastTargets(coastCount(game));
    let previous=0;
    for(const target of targets) {
      await delay(150);
      if(id!==epoch)return;
      const snapshot=copyGame(game);
      for(let j=previous; j<target; j++)snapshot.step(0);
      if(!await animateTo(snapshot, id))return;
      previous=target;
    }
  }
  if(id!==epoch)return;
  busy=false;
  render();
  if(!game.done)$('burn').focus();
}

// Interface events
$('form').onsubmit=e=> {
  e.preventDefault();
  if(game.done||busy)return;
  const raw=$('burn').value.trim();
  if(!/^(?:\d+(?:[.,]\d)?|[.,]\d)$/.test(raw)) {
    errorKey='invalid';
    render();
    return;
  }
  const n=Number(raw.replace(',', '.'));
  if(!Number.isFinite(n)) {
    errorKey='invalid';
    render();
    return;
  }
  if(Math.round(n*10)>game.fuel10) {
    errorKey='shortage';
    render();
    return;
  }
  $('burn').value='';
  runTurn(n);
}
;
$('restart').onclick=()=> {
  if((game.t||busy)&&!confirm(strings[lang].reset))return;
  epoch++;
  busy=false;
  phase='result';
  game=new Game();
  errorKey='';
  $('burn').value='';
  render();
  $('burn').focus();
}
;
window.addEventListener('resize', ()=>render());
$('rus').onclick=()=> {
  lang='ru';
  render();
}
;
$('eng').onclick=()=> {
  lang='en';
  render();
}
;
$('instructions').onclick=()=> {
  $('manual').open=!$('manual').open;
  if($('manual').open)$('manual').scrollIntoView( {
    behavior:'smooth', block:'nearest'
  }
  );
}
;
render();

  </script>
